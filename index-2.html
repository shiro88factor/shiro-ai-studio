<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shiro AI Studio</title>

<style>
body{
    background:#121212;
    color:white;
    font-family:sans-serif;
    padding:15px;
}

h1{
    text-align:center;
}

textarea{
    width:100%;
    height:80px;
    border:none;
    border-radius:10px;
    padding:10px;
    margin-bottom:10px;
}

input[type=file]{
    width:100%;
    margin-bottom:10px;
}

button{
    width:100%;
    padding:12px;
    margin-top:8px;
    border:none;
    border-radius:10px;
    background:#00aaff;
    color:white;
    font-size:16px;
}

canvas{
    width:100%;
    margin-top:15px;
    border-radius:10px;
    background:white;
}
</style>
</head>

<body>

<h1>Shiro AI Studio</h1>

<textarea
id="editPrompt"
placeholder="銀髪に変更、背景を海に変更"></textarea>

<input
type="file"
id="imageInput"
accept="image/*">

<button onclick="makeNormal()">元画像</button>

<button onclick="makeGray()">モノクロ</button>

<button onclick="makeRed()">赤っぽく</button>

<button onclick="makeBlue()">青っぽく</button>

<button onclick="testHF()">
HF通信テスト
</button>

<button onclick="showImage()">
画像を書き出し
</button>


<canvas id="canvas"></canvas>

<script>

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

let originalImage = null;

document
.getElementById("imageInput")
.addEventListener("change", function(e){

const file = e.target.files[0];

if(!file) return;

const reader = new FileReader();

reader.onload = function(event){

const img = new Image();

img.onload = function(){

canvas.width = img.width;
canvas.height = img.height;

ctx.drawImage(
img,
0,
0
);

originalImage = img;

};

img.src = event.target.result;

};

reader.readAsDataURL(file);

});

function resetImage(){

if(!originalImage) return;

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

ctx.drawImage(
originalImage,
0,
0
);

}

function makeNormal(){

resetImage();

}

function makeGray(){

resetImage();

const imageData =
ctx.getImageData(
0,
0,
canvas.width,
canvas.height
);

const data =
imageData.data;

for(let i=0;i<data.length;i+=4){

const avg =
(data[i]
+data[i+1]
+data[i+2]) / 3;

data[i] = avg;
data[i+1] = avg;
data[i+2] = avg;

}

ctx.putImageData(
imageData,
0,
0
);

}

function makeRed(){

resetImage();

const imageData =
ctx.getImageData(
0,
0,
canvas.width,
canvas.height
);

const data =
imageData.data;

for(let i=0;i<data.length;i+=4){

data[i] =
Math.min(
255,
data[i] + 60
);

}

ctx.putImageData(
imageData,
0,
0
);

}

function makeBlue(){

resetImage();

const imageData =
ctx.getImageData(
0,
0,
canvas.width,
canvas.height
);

const data =
imageData.data;

for(let i=0;i<data.length;i+=4){

data[i+2] =
Math.min(
255,
data[i+2] + 60
);

}

ctx.putImageData(
imageData,
0,
0
);

}

function showImage(){

const imageData =
canvas.toDataURL(
"image/png"
);

const newWindow =
window.open("");

if(newWindow){

newWindow.document.write(
'<img src="' +
imageData +
'" style="width:100%">'
);

}else{

alert(
"ポップアップがブロックされました"
);

}

}
async function testHF() {

try {

const response = await fetch(
"https://api-inference.huggingface.co/models/stabilityai/stable-diffusion-2",
{
method: "OPTIONS"
}
);

alert(response.status);

}
catch(err){

alert(err);

}

}


  
</script>

</body>
</html>
